name: Release to NuGet.org

# Manually triggered. The version lives in Directory.Build.props and is the single source of truth —
# what the file says is what MSBuild packs. This workflow optionally bumps it, publishes, then commits
# the bump, so after a successful run the file records what was last released.
#
# A push to nuget.org is PERMANENT — a published version can be unlisted but never replaced or deleted.
# Hence the dry run, the branch guard, and the check that the tag does not already exist.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version to publish: bump the file first, or none to publish it as-is'
        type: choice
        required: true
        default: patch
        options:
          - none
          - patch
          - minor
          - major
      dry_run:
        description: 'Build and pack, print the version, publish nothing'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # commit the version bump, create the tag and the GitHub release
  packages: write   # mirror the released version to GitHub Packages
  actions: read     # find and download the CI build of this commit, to compare bundles against

concurrency:
  group: release
  cancel-in-progress: false   # never interrupt a run that may already have pushed

jobs:
  release:
    runs-on: ubuntu-latest

    # Referencing an environment that does not exist yet creates it, unprotected. Add a required reviewer
    # to it in repository settings to make every nuget.org push need a second pair of eyes.
    environment: nuget.org

    steps:
      - name: Guard — releases come from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release must run on main; this run targeted ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Pondhawk.Monaco/js/package-lock.json

      # Rewrites Directory.Build.props in the working tree. NOT committed here — see the commit step
      # further down, which runs only after the package is actually published.
      - name: Resolve version
        id: version
        env:
          # Via the environment rather than inlined into the script. A `choice` input is constrained to
          # its options so this one is safe either way, but interpolating inputs straight into a shell
          # body is the habit that turns an unconstrained input into script injection.
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          if [ "$BUMP" = "none" ]; then
            version="$(.github/scripts/version.sh)"
          else
            version="$(.github/scripts/version.sh bump "$BUMP")"
          fi

          # A tag that already exists means this version was released before. nuget.org would reject the
          # duplicate anyway, but failing here says why instead of failing at the push with a 409.
          # This is also what stops `bump: none` from silently republishing.
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::Tag v${version} already exists. Choose a bump rather than 'none'."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### Releasing \`${version}\`"
            echo ""
            echo "- Bump: \`${BUMP}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # No --packageVersion: MSBuild reads Directory.Build.props, which the step above already holds at
      # the right value. One source of truth, so the nuspec cannot disagree with the file.
      - name: Build, test and pack
        run: ./build.sh --target Pack

      - name: Verify the package carries the expected version
        run: |
          set -euo pipefail
          expected="artifacts/Pondhawk.Monaco.${{ steps.version.outputs.version }}.nupkg"
          [ -f "$expected" ] || { echo "::error::Expected $expected; artifacts/ holds: $(ls artifacts/)"; exit 1; }
          echo "Packed $expected"

      # The release rebuilds rather than promoting what CI already published, because a NuGet version is
      # baked into the .nuspec and the filename — there is no retag. So the bytes about to be published
      # are not literally the bytes CI tested. This checks the one part that could drift without any test
      # noticing: wwwroot/dist, the output of npm and esbuild.
      #
      # Best effort by design. No CI run for this commit (pushed with [skip ci], or CI still running) and
      # no artifact (they expire after 14 days) both mean "cannot verify", which must not block a
      # legitimate release. A bundle that is present AND different is fatal.
      - name: Verify the bundle matches the one CI built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          run_id="$(gh run list --workflow=ci.yml --limit 20 \
            --json headSha,databaseId,conclusion \
            --jq '[.[] | select(.headSha == "'"$GITHUB_SHA"'" and .conclusion == "success")][0].databaseId // empty')"

          if [ -z "$run_id" ]; then
            echo "::notice::No successful CI run for ${GITHUB_SHA}; skipping the bundle comparison."
            exit 0
          fi

          if ! gh run download "$run_id" --pattern 'nupkg-*' --dir ci-build 2>/dev/null; then
            echo "::warning::CI run ${run_id} has no downloadable package (artifacts expire after 14 days); skipping the bundle comparison."
            exit 0
          fi

          ci_pkg="$(find ci-build -name '*.nupkg' | head -n1)"
          [ -n "$ci_pkg" ] || {
            echo "::warning::Downloaded artifact contained no .nupkg; skipping the bundle comparison."
            exit 0
          }

          echo "Comparing against CI run ${run_id}: $(basename "$ci_pkg")"
          .github/scripts/compare-bundles.sh "$ci_pkg" "artifacts/Pondhawk.Monaco.${{ steps.version.outputs.version }}.nupkg"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: artifacts/*.nupkg

      - name: Dry run — stop before publishing
        if: inputs.dry_run
        run: |
          echo "Dry run: built ${{ steps.version.outputs.version }} and published nothing."
          echo "Directory.Build.props was bumped in the runner only; nothing was committed."

      # nuget.org first, then record. The reverse order can leave a committed bump and a tag claiming a
      # release that was never published, which then blocks retrying that same version.
      #
      # No --skip-duplicate here, unlike CI: on a feed where versions are permanent, a duplicate means
      # something is wrong and should be loud.
      # NUGET_ORG_API_KEY is an ORGANISATION secret, shared across pondhawktech rather than copied into
      # each repository. Fail early and by name if it is missing: dotnet nuget push with an empty key
      # gets a 403 from nuget.org, which reads as a permissions problem rather than a missing secret.
      - name: Check the publishing key is available
        if: '!inputs.dry_run'
        env:
          NUGET_KEY: ${{ secrets.NUGET_ORG_API_KEY }}
        run: |
          [ -n "$NUGET_KEY" ] || {
            echo "::error::NUGET_ORG_API_KEY is not visible to this repository."
            echo "::error::It is an organisation secret — check its visibility includes pondhawk-monaco."
            exit 1
          }

      - name: Publish to nuget.org
        if: '!inputs.dry_run'
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ secrets.NUGET_ORG_API_KEY }}"

      - name: Mirror to GitHub Packages
        if: '!inputs.dry_run'
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      # Now that the package exists, record the version that produced it. [skip ci] because this commit
      # changes no code, and a CI prerelease build of it would be noise.
      - name: Commit the version bump
        if: '!inputs.dry_run'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # `bump: none` leaves the file untouched, so there may be nothing to commit.
          if git diff --quiet -- Directory.Build.props; then
            echo "Directory.Build.props already reads ${VERSION}; nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props
          git commit -m "Release ${VERSION} [skip ci]"
          git push origin HEAD:main

      # Tags the commit that was built. Where a bump was committed above that commit is HEAD and carries
      # the matching version file; with `bump: none` HEAD is unchanged and already correct.
      - name: Tag and create the GitHub release
        if: '!inputs.dry_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --target "$(git rev-parse HEAD)" \
            --title "v${VERSION}" \
            --generate-notes \
            artifacts/*.nupkg
