name: CI

# Build, test and pack on every change; publish a prerelease to GitHub Packages from main.
#
# Releases to nuget.org are a separate, manually triggered workflow (release.yml). This one only ever
# produces prerelease versions, so a CI build can never occupy a version number a real release wants.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Node is needed ONLY here and only to bundle Monaco into wwwroot/dist. Consumers of the published
      # package never need it. The cache is the npm download cache, keyed on the lockfile; node_modules
      # itself is absent on a fresh runner, so the csproj's `npm ci` runs every time regardless.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Pondhawk.Monaco/js/package-lock.json

      - name: Compute prerelease version
        id: version
        run: |
          set -euo pipefail

          # --next, not the file's own value: the file records what was LAST released, so suffixing it
          # would give 1.0.0-ci.7 after 1.0.0 shipped — which NuGet orders BELOW the release it follows.
          # The next patch puts prereleases above the last release and below the coming one, which is
          # what a prerelease is supposed to mean.
          #
          # Cake composes it and writes version=X to $GITHUB_OUTPUT, so the whole version comes from one
          # place and later steps read it as a step output.
          ./build.sh --target Version --next=true --suffix="ci.${GITHUB_RUN_NUMBER}"

      # Pack depends on Test in the Cake pipeline, so this restores, builds, tests and packages in one
      # step. Pull requests run it too: packaging is where the static-web-asset plumbing actually gets
      # exercised, and a break there is invisible to the tests.
      - name: Build, test and pack
        run: ./build.sh --target Pack --packageVersion=${{ steps.version.outputs.version }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: artifacts/*.nupkg
          retention-days: 14

      # Only from main. A fork's pull request has a read-only token and could not push anyway, but being
      # explicit keeps the failure a skipped step rather than a confusing 403.
      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PUBLISH_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./build.sh --target Publish \
            --source=https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --skipDuplicate=true
